# Scheduled health check of free market-data sources (no credentials).
# Fails loudly if every source is down; warns (neutral) on partial failure.
name: data-health

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours at :17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Probe free data sources
        id: probe
        run: |
          python scripts/ci/probe_sources.py | tee "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Job summary verdict
        run: |
          if grep -q "OVERALL: FAIL" "$GITHUB_STEP_SUMMARY"; then
            echo "All probed sources failed" >&2
            exit 1
          fi
          echo "At least one source healthy (or warn-only)." >> "$GITHUB_STEP_SUMMARY"
